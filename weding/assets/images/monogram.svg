<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Decorative Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Corner/Accent Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Top Floral Motif -->
    <path d="M 200,32 C 190,50 175,60 155,62 C 175,66 188,78 190,95 C 192,78 205,66 225,62 C 205,60 190,50 200,32 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Bottom Floral Motif -->
    <path d="M 200,368 C 190,350 175,340 155,338 C 175,334 188,322 190,305 C 192,322 205,334 225,338 C 205,340 190,350 200,368 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Left Floral Motif -->
    <path d="M 32,200 C 50,190 60,175 62,155 C 66,175 78,188 95,190 C 78,192 66,205 62,225 C 60,205 50,190 32,200 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Right Floral Motif -->
    <path d="M 368,200 C 350,190 340,175 338,155 C 334,175 322,188 305,190 C 322,192 334,205 338,225 C 340,205 350,190 368,200 Z" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- Inner Crest Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="200" cy="200" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />

  <!-- Crown / Tiara Ornament at Top of Inner Ring -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <polygon points="200,82 208,98 226,98 212,108 217,125 200,115 183,125 188,108 174,98 192,98" transform="scale(0.5) translate(200, 75)" />
    <circle cx="200" cy="115" r="3.5" />
    <circle cx="185" cy="120" r="2.5" />
    <circle cx="215" cy="120" r="2.5" />
  </g>

  <!-- Interlocking Monogram: Y & N -->
  <g id="letters" filter="url(#goldGlow)">
    <!-- Y -->
    <text x="155" y="222" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="78" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">Y</text>
    
    <!-- Ampersand & -->
    <text x="200" y="215" font-family="'Great Vibes', 'Alex Brush', cursive, serif" font-size="52" font-style="italic" fill="url(#goldGrad)" text-anchor="middle" opacity="0.9">&amp;</text>
    
    <!-- N -->
    <text x="245" y="222" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="78" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">N</text>
  </g>

  <!-- Arabic Names Below Monogram -->
  <text x="200" y="270" font-family="'Amiri', 'Traditional Arabic', serif" font-size="24" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">يوسف &amp; نورهان</text>
  
  <!-- Date in small elegant numerals -->
  <text x="200" y="295" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="500" fill="url(#goldGrad)" letter-spacing="4" text-anchor="middle" opacity="0.95">29 . 10 . 2026</text>
</svg>
