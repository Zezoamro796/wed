<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFF2B2" stop-opacity="1"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Central Diamond -->
  <polygon points="250,15 258,25 250,35 242,25" fill="#D4AF37"/>
  <circle cx="250" cy="25" r="2.5" fill="#FFF"/>

  <!-- Left Side Ornaments -->
  <circle cx="232" cy="25" r="3" fill="#D4AF37"/>
  <circle cx="220" cy="25" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="210" cy="25" r="1.5" fill="#D4AF37" opacity="0.6"/>
  <line x1="50" y1="25" x2="200" y2="25" stroke="url(#divGold)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Right Side Ornaments -->
  <circle cx="268" cy="25" r="3" fill="#D4AF37"/>
  <circle cx="280" cy="25" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="290" cy="25" r="1.5" fill="#D4AF37" opacity="0.6"/>
  <line x1="300" y1="25" x2="450" y2="25" stroke="url(#divGold)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
