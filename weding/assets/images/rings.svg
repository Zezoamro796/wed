<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#FFF4BD"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="sparkle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Left Ring (Groom's band) -->
  <circle cx="62" cy="54" r="32" fill="none" stroke="url(#ringGold)" stroke-width="7" />
  
  <!-- Right Ring (Bride's ring with diamond solitaire) -->
  <circle cx="98" cy="54" r="32" fill="none" stroke="url(#ringGold)" stroke-width="6" />
  
  <!-- Interlocking illusion: partial top arc of left ring to appear overlapping -->
  <path d="M 72 26 A 32 32 0 0 1 92 48" fill="none" stroke="url(#ringGold)" stroke-width="7" stroke-linecap="round"/>

  <!-- Solitaire Diamond on Bride's Ring -->
  <g transform="translate(98, 22)" filter="url(#sparkle)">
    <!-- Diamond Setting Prongs -->
    <path d="M -4,0 L 0,-6 L 4,0 Z" fill="url(#ringGold)"/>
    <!-- Diamond Facets -->
    <polygon points="0,-15 -8,-8 -5,0 5,0 8,-8" fill="#F0F8FF" stroke="#C5D3E8" stroke-width="0.8"/>
    <polygon points="0,-15 -3,-8 0,0 3,-8" fill="#FFFFFF"/>
    <!-- Star Sparkle -->
    <path d="M 0,-21 L 2,-16 L 7,-15 L 2,-14 L 0,-9 L -2,-14 L -7,-15 L -2,-16 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
